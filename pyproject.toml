[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecgrisk"
version = "0.1.0"
description = "Patient-Cluster Conformal Risk Control for Ambulatory ECG Quality Gating and Selective Clinical Abstention"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Abhinav Varma Kosuri"},
    {name = "Raisha Sahana M"},
    {name = "A Aishwarya"},
    {name = "Anbhuchelvan Srinivasan"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "wfdb>=4.1",
    "requests>=2.28",
]

[project.urls]
Repository = "https://github.com/vanihbavk/Conformal_ECG_Telemetry"

[tool.setuptools.packages.find]
where = ["src"]
